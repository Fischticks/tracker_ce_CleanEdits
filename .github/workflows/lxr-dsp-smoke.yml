name: LXR DrumVoice Host Smoke Test

on:
  pull_request:
    paths:
      - "synth-plugin-sdk/engines/lxr_dsp/**"
      - "synth-plugin-sdk/tests/**"
      - "synth-plugin-sdk/Makefile"
      - ".github/workflows/lxr-dsp-smoke.yml"
  push:
    branches:
      - feature/lxr02-psyn-poc
    paths:
      - "synth-plugin-sdk/engines/lxr_dsp/**"
      - "synth-plugin-sdk/tests/**"
      - "synth-plugin-sdk/Makefile"
      - ".github/workflows/lxr-dsp-smoke.yml"

permissions:
  contents: read

jobs:
  lxr-drumvoice-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile and run source-backed DrumVoice smoke test
        run: make -C synth-plugin-sdk host-test HOST_CC=gcc
